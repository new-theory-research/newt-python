name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv pip install --system -e . ruff deptry
      - name: Lint
        run: ruff check src/
      - name: Dependency check
        run: deptry .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv pip install --system -e . pytest
      # Two runs, because a single one always silently skips something. Bare,
      # the episode-on-disk tests are skipped behind the [recording] extra —
      # which is how the card's own composability gate sat green without ever
      # asserting anything for two cycles. With the extra, the inverted gates
      # that prove the missing-mcap lantern are the ones that skip. Neither run
      # alone can claim the suite is green, so CI does both. The bare *install*
      # closure stays purity.yml's job; this is only about which tests execute.
      - name: Test (bare install — the missing-extra lanterns run here)
        run: pytest
      - name: Install the recording extra
        run: uv pip install --system -e ".[recording]"
      - name: Test (with the extra — the episode-on-disk tests run here)
        run: pytest
      # Third leg, same argument one extra along. The live-view tests that need
      # the Rerun SDK are marked `requires_view` and skip everywhere else, so
      # without this leg they skip in CI too — green, and never executed. The
      # marked half is small and hermetic (the viewer cache is seeded by a
      # fixture; nothing here reaches npm), so it costs one install.
      - name: Install the view extra
        run: uv pip install --system -e ".[recording,view]"
      - name: Test (with the view extra — the Rerun-dependent tests run here)
        run: pytest
