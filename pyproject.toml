[project]
name = "newt"
version = "0.0.3"
description = "Python SDK for the New Theory inference API"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
    "httpx>=0.25",
    "websockets>=12.0",
    "pillow>=10.0",
]

[project.scripts]
newt = "newt._cli:main"

[project.optional-dependencies]
# Test deps — needed to run pytest tests/test_golden.py.
# Install: pip install -e ".[test]"
test = ["pytest>=8.0"]

# Hardware demo deps — client-side only; not needed for serve or library users.
# lerobot is a private fork; requires SSH key to github.com/new-theory-research.
# Install: pip install ".[hardware]"
hardware = [
    "lerobot @ git+ssh://git@github.com/new-theory-research/lerobot.git@50168c2a16dd4c67275f9918bf327c1513380061",
]

# Recording deps — for newt.recording.Session + `newt record` + `newt episodes`.
# Heavy and hardware-adjacent on purpose: kept OUT of core so `import newt` stays
# featherweight (brief-252 purity golden). Imported lazily; absent = a lantern
# naming this extra. Install: pip install "newt[recording]"
recording = [
    "mcap>=1.1,<2.0",
    "protobuf>=4.25,<6.0",
    "opencv-python>=4.8,<5.0",
]

# The live view — `newt record --view`. Pinned to one minor, not floored: the
# viewer's WebAssembly glue is built against one exact SDK version and a
# mismatched pair does not load at all, so newt fetches the browser half keyed on
# `rerun.__version__`. A range wide enough to cross that boundary would serve a
# viewer that cannot open the stream beside it.
# Install: pip install "newt[view]"
view = [
    "rerun-sdk>=0.34.1,<0.35",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "deptry>=0.20"]

# `view` and `hardware` cannot be resolved into one environment, and saying so is
# the only honest thing to write here. Our lerobot fork pins `rerun-sdk<0.23`
# (for its own `visualize_dataset` / `teleoperate` scripts); the live view needs
# `>=0.34.1` for `rr.Scalars`, `rerun.urdf` and the gRPC proxy. Nothing can be
# widened to bridge that: lowering the view's pin deletes APIs it calls, and
# raising lerobot's is a change to a different repository.
#
# Declaring the conflict is what lets `uv lock` produce a lock at all — without
# it the whole resolution fails, including for the many installs that ask for
# neither extra. It costs nothing real: `newt[hardware]` is a convenience alias
# for the lerobot fork and NO code in this package imports it (see the DEP002
# ignore below). A rig gets lerobot from its starter kit, not from here, which is
# why `newt record --view` against live arms works on a real bench even though
# these two extras will not co-resolve — see `scripts/bench/live-view/README.md`
# § "Installing view beside lerobot" for the rig recipe and its receipts.
[tool.uv]
conflicts = [[{ extra = "view" }, { extra = "hardware" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required to allow `lerobot @ git+ssh://...` as a direct-URL dep in [hardware].
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/newt"]
# The served page is data, not code: hatchling ships .py from `packages` and would
# leave the html/css/js behind, which is a session that starts, prints a URL, and
# serves a 404.
artifacts = ["src/newt/live/page/*"]
# PEP 561: ship the py.typed marker so the SDK's type hints reach mypy/pyright/
# IDEs/agents. Explicit force-include makes this deterministic across build
# methods (a bare `packages` include can miss a data file depending on VCS state).
#
# NOTICE and licenses/ ride along for a different reason and a harder one: the
# page assets above are adapted from Rerun-copyright code under MIT OR Apache-2.0,
# both of which require the licence text and the copyright notice to travel with
# every copy. Shipping those files in the wheel without these makes every install
# a redistribution missing its licence.
force-include = { "src/newt/py.typed" = "newt/py.typed", "NOTICE" = "newt/NOTICE", "licenses/LICENSE-MIT.rerun" = "newt/licenses/LICENSE-MIT.rerun", "licenses/LICENSE-APACHE.rerun" = "newt/licenses/LICENSE-APACHE.rerun" }

[tool.deptry]
# Scan tests too (default excludes them) — httpx/pytest are used there, not in src/.
# scripts/ holds bench instruments, not shipped code. shoot_view.py drives a real
# browser and is run as `uv run --with playwright python scripts/shoot_view.py` —
# declaring playwright as a project dependency to satisfy a scan would put a
# browser download in every install of the SDK.
exclude = ["\\.venv.*", "\\.direnv", "\\.git", "setup\\.py", "scripts"]
known_first_party = ["newt"]

# rerun-sdk installs its modules as `rerun` (and `rerun_sdk`), which deptry cannot
# infer from the distribution name alone — without this it reads every `import
# rerun` in newt/live as an undeclared transitive.
[tool.deptry.package_module_name_map]
rerun-sdk = ["rerun", "rerun_sdk"]
# protobuf installs into the `google` namespace. deptry can infer that from
# installed metadata, so a local scan with the [recording] extra present is
# clean — but CI lints a bare `-e .` install, where the fixture generator's
# `from google.protobuf import ...` has nothing to resolve against. Stating the
# mapping makes the scan answer the same either way.
protobuf = ["google"]

[tool.deptry.per_rule_ignores]
# lerobot: declared in the [hardware] extra for the robot-path integration;
# not imported by any current src/ or test code. sshtunnel/ml_collections were
# dropped entirely in brief-306: their only consumers (run_robot_client.py,
# imitation_mirror/) were deleted by brief-246.
# mcap/protobuf/opencv-python: [recording] extra, loaded via the lazy require()
# lantern in newt.recording (brief-267) — real usage deptry's static scan can't see.
DEP002 = ["lerobot", "mcap", "protobuf", "opencv-python"]
# typing_extensions: pre-existing Python<3.8 fallback import in _embodiment.py;
# not a declared dependency, out of scope for brief-306.
DEP003 = ["typing_extensions"]
